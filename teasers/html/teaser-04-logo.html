<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRINITY_ | Teaser 04 - Logo Reveal</title>
  <link rel="stylesheet" href="../css/terminal.css">
  <style>
    .logo-wrapper {
      width: 500px;
      height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 40px;
    }

    .logo-wrapper img {
      width: 100%;
      height: 100%;
    }

    .creation-text {
      font-size: 14px;
      color: var(--terminal-gray);
      letter-spacing: 4px;
      margin-top: 20px;
      text-transform: uppercase;
    }

    .main-tagline {
      font-size: 24px;
      letter-spacing: 8px;
      margin-top: 30px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="teaser">
    <div class="grid-bg"></div>

    <div class="terminal-header">
      <span>GENESIS://PROTOCOL</span>
      <span>ACTIVE</span>
    </div>

    <div class="content">
      <div class="creation-text">Where human meets machine</div>

      <div class="logo-wrapper">
        <img src="../assets/trinity-logo.svg" alt="Trinity Logo">
      </div>

      <div class="main-tagline">The spark of creation</div>

      <div class="trinity-bar">
        <div class="trinity-dot openai"></div>
        <div class="trinity-dot claude"></div>
        <div class="trinity-dot gemini"></div>
      </div>
    </div>

    <div class="terminal-footer">
      <span>[ TEASER 04 ]</span>
      <span>GENESIS</span>
    </div>
  </div>
</body>
</html>
