<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRINITY_ | Teaser 01</title>
  <link rel="stylesheet" href="../css/terminal.css">
</head>
<body>
  <div class="teaser">
    <div class="grid-bg"></div>

    <div class="terminal-header">
      <span>SYSTEM://TRINITY_</span>
      <span>v0.0.1</span>
    </div>

    <div class="content">
      <div class="title glitch">TRINITY_</div>
      <div class="tagline">Step into the void</div>

      <div class="command-line">
        <span class="prompt">&gt; initializing_reality</span>
        <span class="cursor"></span>
      </div>

      <div class="trinity-bar">
        <div class="trinity-dot openai"></div>
        <div class="trinity-dot claude"></div>
        <div class="trinity-dot gemini"></div>
      </div>
    </div>

    <div class="terminal-footer">
      <span>[ TEASER 01 ]</span>
      <span>COMING SOON</span>
    </div>
  </div>
</body>
</html>
