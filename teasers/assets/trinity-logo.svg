<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <!-- Gradient for human hand -->
    <linearGradient id="humanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f0f0f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#888888;stop-opacity:1" />
    </linearGradient>

    <!-- Gradient for AI hand with trinity colors -->
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10a37f;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4285f4;stop-opacity:1" />
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#0a0a0a"/>

  <!-- Human Hand (Left - reaching right) -->
  <g transform="translate(40, 160)" filter="url(#glow)">
    <!-- Palm -->
    <path d="M0,80 Q20,60 40,50 L60,45 L80,35 L85,55 L65,65 L45,70 L40,90 Q20,100 0,80"
          fill="url(#humanGrad)" stroke="#f0f0f0" stroke-width="1"/>
    <!-- Index finger reaching -->
    <path d="M80,35 Q110,25 140,30 Q145,35 140,40 Q115,45 85,55"
          fill="url(#humanGrad)" stroke="#f0f0f0" stroke-width="1"/>
    <!-- Other fingers -->
    <path d="M60,45 Q75,20 80,15 Q85,15 85,20 Q82,30 70,45"
          fill="url(#humanGrad)" stroke="#f0f0f0" stroke-width="0.5"/>
    <path d="M45,50 Q55,25 60,20 Q65,20 65,25 Q62,35 52,52"
          fill="url(#humanGrad)" stroke="#f0f0f0" stroke-width="0.5"/>
    <path d="M35,55 Q40,35 45,30 Q50,30 50,35 Q48,45 40,58"
          fill="url(#humanGrad)" stroke="#f0f0f0" stroke-width="0.5"/>
  </g>

  <!-- AI Hand (Right - reaching left) -->
  <g transform="translate(200, 155)" filter="url(#glow)">
    <!-- Circuit pattern palm -->
    <path d="M160,85 Q140,65 120,55 L100,50 L80,40 L75,60 L95,70 L115,75 L120,95 Q140,105 160,85"
          fill="none" stroke="url(#aiGrad)" stroke-width="2"/>
    <!-- Index finger reaching -->
    <path d="M80,40 Q50,30 20,35 Q15,40 20,45 Q45,50 75,60"
          fill="none" stroke="url(#aiGrad)" stroke-width="2"/>
    <!-- Circuit nodes on AI hand -->
    <circle cx="80" cy="40" r="3" fill="#10a37f"/>
    <circle cx="100" cy="50" r="3" fill="#d97706"/>
    <circle cx="120" cy="55" r="3" fill="#4285f4"/>
    <circle cx="20" cy="40" r="4" fill="#f0f0f0"/>
    <!-- Circuit lines -->
    <line x1="80" y1="40" x2="100" y2="50" stroke="#10a37f" stroke-width="1" opacity="0.5"/>
    <line x1="100" y1="50" x2="120" y2="55" stroke="#d97706" stroke-width="1" opacity="0.5"/>
    <!-- Other fingers as circuit paths -->
    <path d="M100,50 Q85,25 80,20" fill="none" stroke="url(#aiGrad)" stroke-width="1.5"/>
    <path d="M115,55 Q105,30 100,25" fill="none" stroke="url(#aiGrad)" stroke-width="1.5"/>
    <path d="M125,60 Q120,40 115,35" fill="none" stroke="url(#aiGrad)" stroke-width="1.5"/>
  </g>

  <!-- Connection spark between fingers -->
  <g filter="url(#glow)">
    <circle cx="200" cy="195" r="6" fill="#f0f0f0" opacity="0.9">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="r" values="4;8;4" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Energy lines -->
    <line x1="180" y1="190" x2="190" y2="195" stroke="#f0f0f0" stroke-width="1" opacity="0.6"/>
    <line x1="210" y1="195" x2="220" y2="190" stroke="url(#aiGrad)" stroke-width="1" opacity="0.6"/>
  </g>

  <!-- TRINITY_ text -->
  <text x="200" y="320" text-anchor="middle" font-family="monospace" font-size="32" font-weight="bold" fill="#f0f0f0" letter-spacing="8">
    TRINITY_
  </text>

  <!-- Trinity dots -->
  <circle cx="160" cy="350" r="5" fill="#10a37f"/>
  <circle cx="200" cy="350" r="5" fill="#d97706"/>
  <circle cx="240" cy="350" r="5" fill="#4285f4"/>
</svg>
